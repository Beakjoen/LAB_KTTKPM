<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .add-section {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #333;
            background-color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        .todo-list {
            background: white;
            border: 1px solid #ddd;
            margin-top: 20px;
        }

        .todo-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item.completed {
            background-color: #f9f9f9;
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #999;
        }

        .todo-actions button {
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 5px;
        }

        .edit-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background-color: #ffe6e6;
            border: 1px solid #ffcccc;
            padding: 10px;
            margin: 10px 0;
            color: #cc0000;
        }
    </style>
</head>
<body>
    <h1>Todo List</h1>

    <div class="add-section">
        <input type="text" id="todoInput" placeholder="Thêm công việc mới..." />
        <button onclick="addTodo()">Thêm</button>
    </div>

    <div id="errorMessage"></div>

    <div class="todo-list" id="todoList">
        <div class="empty">Đang tải...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:5062/api/todo';
        let todos = [];
        let editingId = null;

        window.onload = () => {
            loadTodos();
            document.getElementById('todoInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodo();
            });
        };

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => errorDiv.innerHTML = '', 5000);
        }

        async function loadTodos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Không thể tải dữ liệu');
                todos = await response.json();
                renderTodos();
            } catch (error) {
                showError('Lỗi: ' + error.message);
                document.getElementById('todoList').innerHTML = '<div class="empty">Không thể tải dữ liệu</div>';
            }
        }

        function renderTodos() {
            const todoList = document.getElementById('todoList');
            
            if (todos.length === 0) {
                todoList.innerHTML = '<div class="empty">Chưa có công việc nào</div>';
                return;
            }

            todoList.innerHTML = todos.map(todo => {
                if (editingId === todo.id) {
                    return `
                        <div class="todo-item">
                            <input type="text" class="edit-input" id="editInput${todo.id}" value="${todo.title}" />
                            <button onclick="saveEdit(${todo.id})">Lưu</button>
                            <button onclick="cancelEdit()">Hủy</button>
                        </div>
                    `;
                }
                
                return `
                    <div class="todo-item ${todo.isCompleted ? 'completed' : ''}">
                        <input type="checkbox" ${todo.isCompleted ? 'checked' : ''} 
                               onchange="toggleComplete(${todo.id}, ${!todo.isCompleted})" />
                        <span class="todo-text ${todo.isCompleted ? 'completed' : ''}">${todo.title}</span>
                        <div class="todo-actions">
                            <button onclick="startEdit(${todo.id})">Sửa</button>
                            <button onclick="deleteTodo(${todo.id})">Xóa</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();

            if (!title) {
                showError('Vui lòng nhập nội dung!');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, isCompleted: false })
                });

                if (!response.ok) throw new Error('Không thể thêm');

                input.value = '';
                await loadTodos();
            } catch (error) {
                showError('Lỗi: ' + error.message);
            }
        }

        function startEdit(id) {
            editingId = id;
            renderTodos();
            document.getElementById(`editInput${id}`).focus();
        }

        function cancelEdit() {
            editingId = null;
            renderTodos();
        }

        async function saveEdit(id) {
            const input = document.getElementById(`editInput${id}`);
            const title = input.value.trim();

            if (!title) {
                showError('Tiêu đề không được để trống!');
                return;
            }

            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, title, isCompleted: todo.isCompleted })
                });

                if (!response.ok) throw new Error('Không thể cập nhật');

                editingId = null;
                await loadTodos();
            } catch (error) {
                showError('Lỗi: ' + error.message);
            }
        }

        async function toggleComplete(id, isCompleted) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, title: todo.title, isCompleted })
                });

                if (!response.ok) throw new Error('Không thể cập nhật');

                await loadTodos();
            } catch (error) {
                showError('Lỗi: ' + error.message);
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Xóa công việc này?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Không thể xóa');

                await loadTodos();
            } catch (error) {
                showError('Lỗi: ' + error.message);
            }
        }
    </script>
</body>
</html>
